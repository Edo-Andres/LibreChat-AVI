    modalContent: |
      # Términos de Servicio de AVI (Asistente Virtual en Infancia)


      ## ¿Qué es AVI?
      AVI es un asistente virtual con inteligencia artificial diseñado por el Centro de Innovación y Estudios de la Corporación Crecer Mejor. Su propósito es acompañarte en el cuidado de niños, niñas y adolescentes que han vivido situaciones de grave vulneración, ayudándote a tomar mejores decisiones basadas en evidencia científica y a optimizar los recursos disponibles.

      ## ¿Qué puede hacer AVI por ti?
      - Ofrecerte consejos prácticos y accionables que fortalezcan tu labor de cuidado.
      - Apoyarte en el aprendizaje continuo sobre el cuidado de niños, niñas y adolescentes.
      - Facilitarte estrategias respaldadas por evidencia científica para la prevención y el cuidado especializado.
      - Diseñar y estructurar actividades, talleres o metodologías para apoyar el cuidado.

      ## ¿Qué NO es AVI?
      Es importante que sepas que AVI tiene limitaciones:
      - NO es una herramienta de atención clínica ni psicológica.
      - NO sustituye el juicio profesional especializado.
      - NO realiza diagnósticos médicos ni proporciona tratamientos clínicos.

      ## Privacidad y seguridad de tu información
      Tu privacidad es nuestra prioridad. Toda tu información personal y tus conversaciones con AVI son completamente confidenciales. Nunca compartimos tus datos con terceros. Solo utilizamos esta información para mejorar nuestros servicios y asegurar que tu experiencia sea segura y útil.

      ## Importante: AVI puede cometer errores.
      Como toda herramienta de inteligencia artificial, AVI no es infalible y puede proporcionar información inexacta o incompleta. Por eso, te recomendamos siempre verificar la información que recibas, especialmente cuando se trate de decisiones importantes relacionadas con el cuidado y bienestar de los niños, niñas y adolescentes.

      ## Tu compromiso y aceptación
      Al utilizar AVI, confirmas que has leído y comprendido estos términos de servicio. Te comprometes a usar esta herramienta de manera responsable y ética, siempre en beneficio del bienestar de los niños, niñas y adolescentes bajo tu cuidado. Te pedimos no subir datos sensibles de los NNA a tu cargo, como por ejemplo sus datos de identidad (Rut, dirección, etc.).

      Gracias por tu dedicación al cuidado de niños, niñas y adolescentes.
      AVI está aquí para acompañarte en esta importante labor.
      
