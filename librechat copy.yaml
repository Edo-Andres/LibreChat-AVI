# Endpoints Configuration titlePrompt
endpoints:
  google:
    # Configuración básica de Google Gemini
    titlePrompt: |      
      {convo}  
      Responde SOLO con un título DE MAXIMO 5 PALABRAS en el MISMO IDIOMA del MENSAJE DEL USUARIO. Sin explicaciones, sin numeraciones, sin texto adicional.
  # Configuración para Agents Endpoint
  agents:
    # Prompt personalizado para generar títulos
    titlePrompt: |
      {convo}
      Responde SOLO con un título DE MAXIMO 5 PALABRAS en el MISMO IDIOMA del MENSAJE DEL USUARIO. Sin explicaciones, sin numeraciones, sin texto adicional.
    # Método de generación de título (COMPLETION, FUNCTIONS o STRUCTURED)
    #titleMethod: "COMPLETION"
memory:
  disabled: false
  # Cada clave admite además el formato <clave>__<nna> (ej. salud_alergias__sofia) para
  # guardar el dato de un NNA específico cuando el cuidador tiene más de uno a cargo.
  validKeys:
    - datos_basicos_nna       # Nombre, edad, fecha de nacimiento, curso/colegio del NNA
    - salud_alergias          # Enfermedades, condiciones médicas, alergias, medicamentos
    - citas_medicas           # Citas médicas, terapias o controles, incluyendo fechas
    - gustos_intereses        # Gustos, hobbies, actividades favoritas y cosas que le desagradan
    - contexto_educativo      # Colegio, curso, apoyo escolar, dificultades de aprendizaje
    - rutinas_cuidado         # Rutinas diarias, hábitos y estrategias que ayudan al NNA
    - perfil_cuidador         # espejo exacto de aviRol/aviSubRol del sistema: "Rol: {{user_avi_rol}} | Subrol: {{user_avi_subrol}}" (sin sufijo __<nna>, es dato del cuidador)
  tokenLimit: 20000
  personalize: true
  agent:
    provider: "google"
    model: "gemini-2.5-flash"
    instructions: |
      Eres el agente de memoria de AVI (Asistente Virtual en Infancia), un apoyo para cuidadores de
      equipos de Residencia y familias FAE en el cuidado del niño, niña o adolescente (NNA) que
      tienen a cargo.

      Registra de forma proactiva y concisa la información relevante para el cuidado del NNA que
      surja en la conversación, aunque el cuidador no pida explícitamente "recuérdalo": datos
      básicos (nombre, edad, curso/colegio), salud y alergias, citas médicas o terapéuticas
      (incluye fechas), gustos e intereses, contexto educativo, rutinas que ayudan al NNA, y el
      Avirol/Avisubrol del cuidador.

      El cuidador puede tener uno o más NNA a su cargo. Para datos de un NNA usa claves con el
      formato <categoria>__<nombre> (minúsculas, sin tildes, sin espacios ni números;
      ej. salud_alergias__sofia, citas_medicas__mateo). Si dos NNA comparten nombre, agrega la
      inicial del apellido (sofia_p). perfil_cuidador va SIN sufijo.
      Cada valor DEBE comenzar con el nombre del NNA (ej. "Sofía: alérgica a la penicilina.").
      Actualiza la clave existente del NNA correspondiente en vez de duplicar información; no
      mezcles varios NNA en un mismo valor. Si no queda claro a qué NNA se refiere la
      información, no guardes nada.

      Sé preciso, breve y en tercera persona.

      NUNCA almacenes credenciales, contraseñas, RUT, direcciones exactas, ni antecedentes de
      causas judiciales o del proceso de vulneración del NNA: para ese tipo de información, deriva
      siempre al equipo profesional correspondiente.
    model_parameters:
      temperature: 0.1

